<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Lenskart Rx Validator</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 760px;
        margin: 40px auto;
        padding: 0 16px;
        color: #222;
      }
      h1 {
        font-size: 22px;
      }
      h2 {
        font-size: 16px;
        margin: 24px 0 8px;
      }
      .visually-hidden {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
      }
      .paste-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin: 12px 0 20px;
        flex-wrap: wrap;
      }
      .paste-row input[type="text"] {
        flex: 1;
        min-width: 220px;
      }
      table {
        border-collapse: collapse;
        margin: 16px 0;
        width: 100%;
      }
      th,
      td {
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      .field-wrap {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      input[type="text"] {
        width: 90px;
        padding: 6px;
        border: 2px solid #bbb;
        border-radius: 4px;
        font-size: 14px;
      }
      input:focus-visible,
      button:focus-visible,
      select:focus-visible {
        outline: 3px solid #1a5fd0;
        outline-offset: 1px;
      }
      input.state-bad {
        border-color: #d33;
        background: #fff3f3;
      }
      input.state-warn {
        border-color: #c98a00;
        background: #fffaf0;
      }
      input.state-ok {
        border-color: #3a9b5c;
        background: #f3fbf5;
      }
      .stepper {
        display: flex;
        flex-direction: column;
      }
      .stepper button {
        padding: 0 4px;
        font-size: 10px;
        line-height: 1.3;
        margin: 0;
      }
      .field-msg {
        font-size: 11px;
        min-height: 14px;
        margin-top: 3px;
        max-width: 160px;
      }
      .field-msg.bad {
        color: #b00;
      }
      .field-msg.warn {
        color: #a66a00;
      }
      button {
        padding: 8px 12px;
        margin-right: 6px;
        border: 1px solid #888;
        border-radius: 4px;
        background: #f5f5f5;
        cursor: pointer;
      }
      button.primary {
        background: #1a5fd0;
        color: #fff;
        border-color: #1a5fd0;
      }
      button.small {
        padding: 2px 6px;
        font-size: 11px;
        margin: 2px 0 0;
      }
      button.fix {
        background: #eaf2ff;
        border-color: #1a5fd0;
        color: #1a5fd0;
      }
      .toolbar {
        margin-top: 10px;
      }
      #result {
        margin-top: 20px;
        padding: 12px;
        border-radius: 6px;
        display: none;
      }
      #result.ok {
        display: block;
        background: #eaf7ee;
        border: 1px solid #3a9b5c;
      }
      #result.err {
        display: block;
        background: #fdeeee;
        border: 1px solid #d33;
      }
      #result ul {
        margin: 6px 0 0 18px;
        padding: 0;
      }
      code {
        font-size: 12px;
        color: #666;
      }
      .dial {
        width: 70px;
        height: 42px;
      }
      #summaryCard {
        display: none;
        margin-top: 16px;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        background: #fafafa;
      }
      #summaryCard.show {
        display: block;
      }
      .summary-cols {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
      }
      .summary-cols > div {
        min-width: 180px;
      }
      .score-bar-track {
        height: 10px;
        border-radius: 5px;
        background: #e2e2e2;
        overflow: hidden;
        margin: 6px 0;
      }
      .score-bar-fill {
        height: 100%;
      }
      .band-typical {
        background: #3a9b5c;
      }
      .band-double_check {
        background: #c98a00;
      }
      .band-verify {
        background: #d33;
      }
      .reasons {
        font-size: 12px;
        margin: 4px 0 0 18px;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <h1>Lenskart Rx Validator</h1>
    <p>
      Enter SPH, CYL and Axis for each eye. CYL and Axis can be blank if there
      is no astigmatism. Use ArrowUp/ArrowDown on a field to step it, or the
      +/- buttons.
    </p>

    <div class="paste-row">
      <label for="pasteEye" class="visually-hidden">Eye to fill from pasted text</label>
      <select id="pasteEye">
        <option value="right">Right (OD)</option>
        <option value="left">Left (OS)</option>
      </select>
      <label for="pasteText" class="visually-hidden">Paste prescription notation</label>
      <input
        type="text"
        id="pasteText"
        placeholder='Paste e.g. "-1.25 -0.50 x 90" or "-1.25/-0.50x90"'
      />
      <button type="button" id="parseBtn">Parse into eye</button>
    </div>

    <form id="rxForm">
      <table>
        <tr>
          <th></th>
          <th>SPH</th>
          <th>CYL</th>
          <th>Axis</th>
          <th>Dial</th>
        </tr>
        <tr>
          <td><b>Right (OD)</b></td>
          <td id="cell-right-sph"></td>
          <td id="cell-right-cyl"></td>
          <td id="cell-right-axis"></td>
          <td><svg class="dial" id="dial-right" viewBox="0 0 70 42"></svg></td>
        </tr>
        <tr>
          <td><b>Left (OS)</b></td>
          <td id="cell-left-sph"></td>
          <td id="cell-left-cyl"></td>
          <td id="cell-left-axis"></td>
          <td><svg class="dial" id="dial-left" viewBox="0 0 70 42"></svg></td>
        </tr>
      </table>

      <div class="toolbar">
        <button class="primary" type="submit">Validate</button>
        <button type="button" onclick="fill(VALID)">Fill valid sample</button>
        <button type="button" onclick="fill(BAD)">Fill bad sample</button>
        <button type="button" onclick="copyRightToLeft()">Copy Right to Left</button>
        <button type="button" onclick="fill(EMPTY)">Clear</button>
      </div>
    </form>

    <div id="result" aria-live="polite"></div>

    <div id="summaryCard" aria-live="polite">
      <h2>Summary</h2>
      <div class="summary-cols">
        <div>
          <b>Right</b>
          <div id="summary-right"></div>
        </div>
        <div>
          <b>Left</b>
          <div id="summary-left"></div>
        </div>
      </div>
      <h2>Plausibility</h2>
      <div id="plausibility"></div>
    </div>

    <script>
      const EYES = ["right", "left"];
      const FIELDS = ["sph", "cyl", "axis"];
      const STEP = { sph: 0.25, cyl: 0.25, axis: 1 };
      const BAND_LABEL = {
        typical: "Typical",
        double_check: "Double-check",
        verify: "Verify against original Rx",
      };
      const VALID = {
        right: ["-1.25", "-0.50", "90"],
        left: ["plano", "", ""],
      };
      const BAD = { right: ["25", "-1.00", ""], left: ["abc", "0", "200"] };
      const EMPTY = { right: ["", "", ""], left: ["", "", ""] };

      let lastResult = null;

      // --- build the input cells (label + input + stepper) once ---------------
      EYES.forEach((eye) => {
        FIELDS.forEach((field) => {
          const cell = document.getElementById(`cell-${eye}-${field}`);
          const id = `${eye}-${field}`;
          const labelText = `${eye === "right" ? "Right" : "Left"} eye ${field.toUpperCase()}`;

          const label = document.createElement("label");
          label.setAttribute("for", id);
          label.className = "visually-hidden";
          label.textContent = labelText;

          const wrap = document.createElement("div");
          wrap.className = "field-wrap";

          const input = document.createElement("input");
          input.type = "text";
          input.id = id;
          input.name = id;
          input.autocomplete = "off";

          const stepper = document.createElement("div");
          stepper.className = "stepper";
          const up = document.createElement("button");
          up.type = "button";
          up.className = "small";
          up.textContent = "▲";
          up.setAttribute("aria-label", `Increase ${labelText}`);
          up.onclick = () => step(eye, field, 1);
          const down = document.createElement("button");
          down.type = "button";
          down.className = "small";
          down.textContent = "▼";
          down.setAttribute("aria-label", `Decrease ${labelText}`);
          down.onclick = () => step(eye, field, -1);
          stepper.appendChild(up);
          stepper.appendChild(down);

          wrap.appendChild(input);
          wrap.appendChild(stepper);

          const msg = document.createElement("div");
          msg.className = "field-msg";
          msg.id = `${id}-msg`;

          cell.appendChild(label);
          cell.appendChild(wrap);
          cell.appendChild(msg);

          input.addEventListener("input", () => debouncedValidate());
          input.addEventListener("keydown", (e) => {
            if (e.key === "ArrowUp") {
              e.preventDefault();
              step(eye, field, 1);
            } else if (e.key === "ArrowDown") {
              e.preventDefault();
              step(eye, field, -1);
            }
          });
        });
      });

      function debounce(fn, ms) {
        let t;
        return (...args) => {
          clearTimeout(t);
          t = setTimeout(() => fn(...args), ms);
        };
      }
      const debouncedValidate = debounce(validateRx, 300);

      function fmtPower(v) {
        return (v >= 0 ? "+" : "") + v.toFixed(2);
      }

      function step(eye, field, direction) {
        const el = document.getElementById(`${eye}-${field}`);
        const current = parseFloat(el.value);
        const base = isNaN(current) ? 0 : current;
        const next = base + direction * STEP[field];
        el.value = field === "axis" ? String(Math.round(next)) : fmtPower(next);
        validateRx();
      }

      function fill(sample) {
        EYES.forEach((eye) =>
          FIELDS.forEach((f, i) => {
            document.getElementById(`${eye}-${f}`).value = sample[eye][i];
          }),
        );
        validateRx();
      }

      function copyRightToLeft() {
        FIELDS.forEach((f) => {
          document.getElementById(`left-${f}`).value =
            document.getElementById(`right-${f}`).value;
        });
        validateRx();
      }

      function parsePaste(text) {
        if (!text || !text.trim()) return null;
        const parts = text.split(/x/i);
        const left = parts[0].trim();
        const axisStr = parts.length > 1 ? parts[1].trim() : "";
        const tokens = left.split(/[\/\s]+/).filter(Boolean);
        if (tokens.length === 0) return null;
        const sph = tokens[0];
        const cyl = tokens.length > 1 ? tokens[1] : "";
        const axis = axisStr.replace(/[^\d]/g, "");
        return { sph, cyl, axis };
      }

      document.getElementById("parseBtn").addEventListener("click", () => {
        const eye = document.getElementById("pasteEye").value;
        const parsed = parsePaste(document.getElementById("pasteText").value);
        if (!parsed) return;
        document.getElementById(`${eye}-sph`).value = parsed.sph || "";
        document.getElementById(`${eye}-cyl`).value = parsed.cyl || "";
        document.getElementById(`${eye}-axis`).value = parsed.axis || "";
        validateRx();
      });

      function clearMarks() {
        EYES.forEach((eye) =>
          FIELDS.forEach((f) => {
            const el = document.getElementById(`${eye}-${f}`);
            el.classList.remove("state-bad", "state-warn", "state-ok");
            const msg = document.getElementById(`${eye}-${f}-msg`);
            msg.textContent = "";
            msg.className = "field-msg";
          }),
        );
      }

      function esc(s) {
        return String(s).replace(
          /[&<>"]/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c],
        );
      }

      function show(cls, html) {
        const box = document.getElementById("result");
        box.className = cls;
        box.innerHTML = html;
      }

      function applyFix(field, value) {
        document.getElementById(field).value = value;
        validateRx();
      }

      function setFieldState(eye, field, state, message) {
        const el = document.getElementById(`${eye}-${field}`);
        el.classList.remove("state-bad", "state-warn", "state-ok");
        if (state) el.classList.add(`state-${state}`);
        const msg = document.getElementById(`${eye}-${field}-msg`);
        msg.className = "field-msg" + (state === "bad" ? " bad" : state === "warn" ? " warn" : "");
        msg.textContent = message || "";
      }

      // --- axis dial ------------------------------------------------------------
      function drawDialBase(svg) {
        svg.innerHTML =
          '<path d="M 5 38 A 30 30 0 0 1 65 38" fill="none" stroke="#ccc" stroke-width="2"/>' +
          '<circle cx="35" cy="38" r="2" fill="#888"/>';
      }
      EYES.forEach((eye) => drawDialBase(document.getElementById(`dial-${eye}`)));

      function updateDial(eye, axis) {
        const svg = document.getElementById(`dial-${eye}`);
        drawDialBase(svg);
        if (axis === null || axis === undefined || isNaN(axis)) return;
        const rad = (axis * Math.PI) / 180;
        const r = 28;
        const cx = 35,
          cy = 38;
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", cx - r * Math.cos(rad));
        line.setAttribute("y1", cy - r * Math.sin(rad));
        line.setAttribute("x2", cx + r * Math.cos(rad));
        line.setAttribute("y2", cy + r * Math.sin(rad));
        line.setAttribute("stroke", "#1a5fd0");
        line.setAttribute("stroke-width", "2");
        svg.appendChild(line);
      }

      // --- summary / plausibility rendering --------------------------------------
      function renderSummary(data) {
        const card = document.getElementById("summaryCard");
        const summary = data && data.summary;
        const plausibility = data && data.plausibility;
        if (!summary || !plausibility) {
          card.classList.remove("show");
          return;
        }
        card.classList.add("show");
        EYES.forEach((eye) => {
          const s = summary[eye] || {};
          const t = s.transposed || {};
          const el = document.getElementById(`summary-${eye}`);
          el.innerHTML =
            `SE: ${s.se != null ? esc(s.se) : "-"}<br>` +
            `Transposed: SPH ${t.sph != null ? esc(t.sph) : "-"}, ` +
            `CYL ${t.cyl != null ? esc(t.cyl) : "-"}, ` +
            `Axis ${t.axis != null ? esc(t.axis) : "-"}`;
        });
        const band = plausibility.band || "typical";
        const score = plausibility.score != null ? plausibility.score : 100;
        const reasons = plausibility.reasons || [];
        document.getElementById("plausibility").innerHTML =
          `Score: ${score}/100 — ${esc(BAND_LABEL[band] || band)}` +
          `<div class="score-bar-track"><div class="score-bar-fill band-${band}" style="width:${score}%"></div></div>` +
          (reasons.length
            ? `<ul class="reasons">${reasons.map((r) => `<li>${esc(r)}</li>`).join("")}</ul>`
            : "");
      }

      // --- main validate call ----------------------------------------------------
      async function validateRx() {
        clearMarks();
        const payload = {};
        EYES.forEach((eye) => {
          payload[eye] = {};
          FIELDS.forEach((f) => (payload[eye][f] = document.getElementById(`${eye}-${f}`).value));
        });

        let data;
        try {
          const res = await fetch("/validate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload),
          });
          data = await res.json();
        } catch (e) {
          show("err", "Could not reach the server. Is it running?");
          return;
        }
        lastResult = data;

        EYES.forEach((eye) => updateDial(eye, document.getElementById(`${eye}-axis`).value ? parseInt(document.getElementById(`${eye}-axis`).value, 10) : NaN));

        // field states: errors win over warnings win over "has a value" ok state
        const errors = data.errors || [];
        const warnings = data.warnings || [];
        EYES.forEach((eye) =>
          FIELDS.forEach((f) => {
            const value = document.getElementById(`${eye}-${f}`).value;
            if (!value) return;
            setFieldState(eye, f, "ok", "");
          }),
        );
        warnings.forEach((w) => {
          if (w.eye && w.field) setFieldState(w.eye, w.field, "warn", w.message);
        });
        errors.forEach((e) => {
          if (e.eye && e.field) setFieldState(e.eye, e.field, "bad", e.message);
        });

        renderSummary(data);

        if (data.valid) {
          const n = data.normalized;
          const line = (eye) =>
            `${eye === "right" ? "Right" : "Left"}: SPH ${n[eye].sph}, CYL ${n[eye].cyl}, Axis ${n[eye].axis ?? "-"}`;
          let html = `<b>Prescription is valid.</b><br>${line("right")}<br>${line("left")}`;
          if (warnings.length) {
            html += `<br><br><b>${warnings.length} clinical note(s):</b><ul>${warnings
              .map((w) => `<li>${esc(w.message)} <code>${esc(w.code)}</code></li>`)
              .join("")}</ul>`;
          }
          show("ok", html);
          return;
        }

        const items = errors
          .map((e) => {
            const fixBtn =
              e.suggestion && e.eye
                ? ` <button type="button" class="small fix" onclick="applyFix('${e.eye}-${e.suggestion.field}', '${esc(e.suggestion.value)}')">Apply fix: ${esc(e.suggestion.value)}</button>`
                : "";
            return `<li>${esc(e.message)} <code>${esc(e.code)}</code>${fixBtn}</li>`;
          })
          .join("");
        let html = `<b>Prescription has ${errors.length} problem(s):</b><ul>${items}</ul>`;
        if (warnings.length) {
          html += `<b>${warnings.length} clinical note(s):</b><ul>${warnings
            .map((w) => `<li>${esc(w.message)} <code>${esc(w.code)}</code></li>`)
            .join("")}</ul>`;
        }
        show("err", html);
      }

      document.getElementById("rxForm").addEventListener("submit", (e) => {
        e.preventDefault();
        validateRx();
      });
    </script>
  </body>
</html>
